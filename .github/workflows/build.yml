# Builds, tests and publishes GG on a Windows machine on every push.
# The single-file GG.exe is attached to each run as a downloadable artifact.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Build restores for Release itself (Release is self-contained and needs the win-x64 runtime packs).
      - name: Build
        run: dotnet build GG.sln -c Release

      - name: Test
        run: dotnet test tests/GG.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish single-file exe
        run: dotnet publish src/GG.App/GG.App.csproj -c Release -r win-x64 -o publish

      # Start the real exe with a throwaway data folder and a small shortcut folder (one .lnk, one .url).
      # It scans, then closes itself. A crash, a hang or a wrong game count fails the build; the log is printed either way.
      - name: Smoke test (start GG.exe and scan shortcuts)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "gg-smoke"
          $shortcuts = Join-Path $env:RUNNER_TEMP "gg-shortcuts"
          New-Item -ItemType Directory -Force $data, $shortcuts | Out-Null
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $shortcuts "Notepad Test.lnk"))
          $lnk.TargetPath = "$env:WINDIR\System32\notepad.exe"
          $lnk.Save()
          Set-Content (Join-Path $shortcuts "Portal 2.url") "[InternetShortcut]`r`nURL=steam://rungameid/620"
          @{ ShortcutFolder = $shortcuts; RescanOnStartup = $true } | ConvertTo-Json | Set-Content (Join-Path $data "settings.json")

          $env:GG_DATA_DIR = $data
          $p = Start-Process -FilePath publish/GG.exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "GG did not exit within 2 minutes" }
          $log = Get-Content (Join-Path $data "logs/gg.log") -Raw -ErrorAction SilentlyContinue
          Write-Output $log
          if ($p.ExitCode -ne 0) { Write-Error "GG exited with code $($p.ExitCode)"; exit 1 }
          if ($log -notmatch "Found 2 games: 2 Shortcuts") { Write-Error "Shortcut scan did not find the 2 test games"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: GG-win-x64
          path: publish/GG.exe
